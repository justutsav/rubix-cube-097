[project]
name = "ivr"
version = "0.1.0"
description = "IVR channel adapter: Exotel Voicebot WebSocket <-> ai/ turn API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "websockets"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ivr"]
