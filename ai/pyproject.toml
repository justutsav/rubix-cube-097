[project]
name = "engine"
version = "0.1.0"
description = "Interview engine: FSM, field extraction, NSQF eligibility gate, recommender"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",                          # Sarvam speech APIs
]

[project.optional-dependencies]
dev = ["pytest"]
nqr = ["httpx", "openpyxl"]           # refresh the NQR snapshot (tools/import_nqr.py)
tts = ["gtts", "miniaudio"]           # gTTS fallback voice, no account
piper = ["piper-tts==1.8.0", "miniaudio"]   # default voice: free, offline
vosk = ["vosk==0.3.44"]              # offline speech-to-text, no account; 0.3.45 has no macOS wheel

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine"]
